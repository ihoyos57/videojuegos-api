apiVersion: v1
kind: Namespace
metadata:
  name: chaos
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-ksa
  namespace: chaos
  annotations:
    iam.gke.io/gcp-service-account: ${RUNTIME_SA}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: videojuegos
  namespace: chaos
spec:
  replicas: 2
  selector:
    matchLabels: {app: videojuegos}
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app: videojuegos}
    spec:
      serviceAccountName: api-ksa
      initContainers:
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.3
          restartPolicy: Always
          args: ["--port=5432", "--health-check", "--http-port=9090", "--http-address=0.0.0.0", "${SQL_CONNECTION}"]
          startupProbe:
            httpGet: {path: /startup, port: 9090}
            periodSeconds: 2
            failureThreshold: 60
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
      containers:
        - name: api
          image: ${IMAGE}
          ports: [{containerPort: 8080}]
          env:
            - {name: DB_HOST, value: "127.0.0.1"}
            - {name: DB_USER, value: "${DB_USER}"}
            - {name: DB_NAME, value: "${DB_NAME}"}
            - {name: DB_SCHEMA, value: "${DB_SCHEMA}"}
            - {name: APP_VERSION, value: "4.0.0"}
            - {name: PEER_API_URL, value: "${AWS_API_URL}"}
            - {name: CHAOS_ENABLED, value: "${CHAOS_ENABLED}"}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: api-secrets, key: DB_PASSWORD}
            - name: CHAOS_TOKEN
              valueFrom:
                secretKeyRef: {name: api-secrets, key: CHAOS_TOKEN}
          startupProbe:
            httpGet: {path: /health/live, port: 8080}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: 8080}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health/live, port: 8080}
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: videojuegos
  namespace: chaos
spec:
  type: LoadBalancer
  selector: {app: videojuegos}
  ports: [{port: 80, targetPort: 8080}]
