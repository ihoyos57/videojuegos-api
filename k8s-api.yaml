# Ya creados aparte con kubectl (no van en este archivo):
#   - ServiceAccount:  api-ksa
#   - Secret:          db-secret  (clave DB_PASSWORD)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
data:
  DB_USER: "apiuser"
  DB_HOST: "127.0.0.1"          # el sidecar de Cloud SQL Proxy escucha aqui
  DB_PORT: "5432"
  DB_NAME: "videojuegos_db"
  DB_SCHEMA: "public"
  ENVIRONMENT: "production"
  PORT: "8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-v2
  labels:
    app: api-v2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-v2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api-v2
    spec:
      serviceAccountName: api-ksa
      initContainers:
        # Sidecar nativo: arranca antes que la API y vive junto a ella
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.3
          restartPolicy: Always
          args:
            - "--port=5432"
            - "--health-check"
            - "--http-port=9090"
            - "--http-address=0.0.0.0"
            - "videojuegos-api-508522:us-central1:videojuegos-db"
          startupProbe:
            httpGet:
              path: /startup
              port: 9090
            periodSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: api
          image: us-central1-docker.pkg.dev/videojuegos-api-508522/cloud-run-source-deploy/api-v2:1.0.0
          ports:
            - containerPort: 8080
          env:
            # El orden importa: $(VAR) solo ve variables definidas antes
            - name: DB_USER
              valueFrom:
                configMapKeyRef: { name: api-config, key: DB_USER }
            - name: DB_HOST
              valueFrom:
                configMapKeyRef: { name: api-config, key: DB_HOST }
            - name: DB_PORT
              valueFrom:
                configMapKeyRef: { name: api-config, key: DB_PORT }
            - name: DB_NAME
              valueFrom:
                configMapKeyRef: { name: api-config, key: DB_NAME }
            - name: DB_SCHEMA
              valueFrom:
                configMapKeyRef: { name: api-config, key: DB_SCHEMA }
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef: { name: api-config, key: ENVIRONMENT }
            - name: PORT
              valueFrom:
                configMapKeyRef: { name: api-config, key: PORT }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-secret, key: DB_PASSWORD }
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
          # Probes TCP porque no encontre una ruta /health en el codigo.
          # Cuando agregues /health, cambialas por httpGet (ver mensaje).
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-v2
spec:
  type: LoadBalancer
  selector:
    app: api-v2
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-v2
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-v2
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50