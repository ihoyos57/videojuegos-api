services:
  db:
    image: postgres:16
    container_name: videojuegos-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: videojuegos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d videojuegos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-testing:
    build: .
    container_name: videojuegos-api-testing
    restart: always
    env_file:
      - .env.testing
    environment:
      DATABASE_URL: postgresql://admin:admin123@db:5432/videojuegos_db
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  api-production:
    build: .
    container_name: videojuegos-api-production
    restart: always
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://admin:admin123@db:5432/videojuegos_db
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: