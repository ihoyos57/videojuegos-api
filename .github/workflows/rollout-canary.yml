name: Canary - Promoción progresiva 10 / 50 / 100

on:
  workflow_dispatch:
    inputs:
      bake_seconds:
        description: Tiempo de horneado por etapa
        required: true
        type: choice
        options: ["120", "180", "240"]
        default: "120"

permissions:
  contents: read
  id-token: write

concurrency:
  group: videojuegos-canary
  cancel-in-progress: false

env:
  PROJECT_ID: videojuegos-api-2026-ihoyos
  REGION: us-central1
  SERVICE: videojuegos-api-production
  GCP_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exigir release v3.0.0
        run: test "$GITHUB_REF" = "refs/tags/v3.0.0"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Ejecutar etapas y horneado
        env:
          BAKE_SECONDS: ${{ inputs.bake_seconds }}
        run: bash scripts/canary-rollout.sh
      - name: Adjuntar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-rollout-report
          path: reports/
          if-no-files-found: ignore
