name: Canary - Promoción progresiva 10 / 50 / 100

on:
  workflow_dispatch:
    inputs:
      bake_seconds:
        description: Tiempo de horneado por etapa
        required: true
        type: choice
        options: ["120", "180", "240"]
        default: "120"

permissions:
  contents: read
  id-token: write

concurrency:
  group: videojuegos-canary
  cancel-in-progress: false

env:
  PROJECT_ID: videojuegos-api-2026-ihoyos
  REGION: us-central1
  SERVICE: videojuegos-api-production
  CANARY_VERSION: "3.0.0"
  REQUESTS_PER_REVISION: "1000"
  CONCURRENCY: "20"
  MIN_REQUESTS_PER_REVISION: "1000"
  MAX_5XX_RATE: "0.01"
  MAX_4XX_RATE: "0.05"
  MAX_P95_LATENCY_MS: "500"
  MAX_P95_REGRESSION_PERCENT: "20"
  MAX_CPU_UTILIZATION: "0.80"
  MAX_MEMORY_UTILIZATION: "0.85"
  GCP_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}

jobs:
  rollout:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Exigir release v4.0.1
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/tags/v4.0.1" ]]; then
            echo "Ejecuta este workflow desde el tag v4.0.1." >&2
            exit 1
          fi

      - name: Autenticarse en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Configurar Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ejecutar etapas y horneado
        env:
          BAKE_SECONDS: ${{ inputs.bake_seconds }}
        run: bash scripts/canary-rollout.sh

      - name: Adjuntar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-rollout-report
          path: reports/
          if-no-files-found: ignore
