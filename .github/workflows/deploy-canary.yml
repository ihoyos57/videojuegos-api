name: Canary - Build y despliegue (etapa 0, 0% público)

on:
  workflow_dispatch:
    inputs:
      enable_fault_injection:
        description: Habilitar inyección de fallos en el canary (solo para demostrar el rollback)
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: videojuegos-canary
  cancel-in-progress: false

env:
  PROJECT_ID: videojuegos-api-2026-ihoyos
  REGION: us-central1
  SERVICE: videojuegos-api-production
  IMAGE: us-central1-docker.pkg.dev/videojuegos-api-2026-ihoyos/videojuegos-api/api
  GRAFANA_REMOTE_WRITE_URL: https://prometheus-prod-66-prod-us-east-3.grafana.net/api/prom/push
  GRAFANA_METRICS_USER: "3617508"
  GCP_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}

jobs:
  deploy-canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar tag SemVer y derivar versión del canary
        run: |
          [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || {
            echo "Ejecuta desde un tag SemVer vX.Y.Z (por ejemplo v3.0.0)." >&2; exit 1;
          }
          echo "CANARY_VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"

      - name: Autenticar en Google Cloud mediante Workload Identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verificar stable v2 y preparar su etiqueta
        run: |
          SERVICE_JSON=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json)
          READY=$(jq -r '[.status.traffic[] | select(.tag=="stable") | .revisionName][0] // ([.status.traffic[] | select(.percent==100) | .revisionName][0] // .status.latestReadyRevisionName)' <<<"$SERVICE_JSON")
          test -n "$READY" || { echo "No existe revisión estable desplegada." >&2; exit 1; }
          gcloud run services update-traffic "$SERVICE" --project "$PROJECT_ID" --region "$REGION" \
            --to-revisions "$READY=100" --set-tags "stable=$READY"
          echo "STABLE_REVISION=$READY" >> "$GITHUB_ENV"

      - name: Construir y publicar imagen inmutable
        run: |
          TAG="v${CANARY_VERSION}-${GITHUB_SHA::12}"
          docker build --pull --build-arg APP_VERSION="$CANARY_VERSION" -t "$IMAGE:$TAG" .
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker push "$IMAGE:$TAG"
          DIGEST=$(gcloud artifacts docker images describe "$IMAGE:$TAG" --project "$PROJECT_ID" --format='value(image_summary.digest)')
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Digest SHA256 inválido"; exit 1; }
          echo "IMAGE_DIGEST=$IMAGE@$DIGEST" >> "$GITHUB_ENV"

      - name: Validar token de inyección de fallos
        if: ${{ inputs.enable_fault_injection }}
        env:
          CANARY_FAULT_TOKEN: ${{ secrets.CANARY_FAULT_TOKEN }}
        run: |
          [[ "$CANARY_FAULT_TOKEN" =~ ^[A-Za-z0-9_-]{16,}$ ]] || {
            echo "Define el secreto CANARY_FAULT_TOKEN (16+ caracteres, solo letras, números, _ y -)." >&2; exit 1;
          }

      - name: Desplegar revisión canary aislada con 0% público
        env:
          ENABLE_FAULT: ${{ inputs.enable_fault_injection && 'true' || 'false' }}
          CANARY_FAULT_TOKEN: ${{ secrets.CANARY_FAULT_TOKEN }}
          GRAFANA_METRICS_TOKEN: ${{ secrets.GRAFANA_METRICS_WRITE_TOKEN }}
        run: |
          gcloud run deploy "$SERVICE" --project "$PROJECT_ID" --region "$REGION" \
            --image "$IMAGE_DIGEST" --no-traffic --tag canary --no-cpu-throttling \
            --revision-suffix "v3-${GITHUB_RUN_NUMBER}" \
            --update-env-vars "APP_VERSION=$CANARY_VERSION,APP_TRACK=canary,ENABLE_CANARY_FAULT_INJECTION=$ENABLE_FAULT,CANARY_FAULT_TOKEN=$CANARY_FAULT_TOKEN,CANARY_FAULT_LATENCY_SECONDS=1.5,GRAFANA_REMOTE_WRITE_URL=$GRAFANA_REMOTE_WRITE_URL,GRAFANA_METRICS_USER=$GRAFANA_METRICS_USER,GRAFANA_METRICS_TOKEN=$GRAFANA_METRICS_TOKEN"
          CANARY_REV=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" \
            --format='value(status.latestReadyRevisionName)')
          test -n "$CANARY_REV"
          echo "CANARY_REVISION=$CANARY_REV" >> "$GITHUB_ENV"
          gcloud run services update-traffic "$SERVICE" --project "$PROJECT_ID" --region "$REGION" \
            --to-revisions "$STABLE_REVISION=100" --set-tags "stable=$STABLE_REVISION,canary=$CANARY_REV"

      - name: Smoke test por URL etiquetada canary
        run: |
          URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" \
            --format='value(status.url)')
          TAG_URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" \
            --format=json | jq -r '.status.traffic[] | select(.tag=="canary") | .url')
          test -n "$TAG_URL"
          curl -fsS -D /tmp/headers "$TAG_URL/api/v3/juegos/" -o /tmp/body
          grep -qi "^X-App-Version: ${CANARY_VERSION}" /tmp/headers
          grep -qi '^X-App-Track: canary' /tmp/headers
          echo "Canary verificada; 100% del tráfico público permanece en stable."