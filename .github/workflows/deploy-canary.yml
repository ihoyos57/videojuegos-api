name: Canary - Build y despliegue v3.0.0 (0% público)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: videojuegos-canary
  cancel-in-progress: false

env:
  PROJECT_ID: videojuegos-api-2026-ihoyos
  REGION: us-central1
  SERVICE: videojuegos-api-production
  IMAGE: us-central1-docker.pkg.dev/videojuegos-api-2026-ihoyos/videojuegos-api/api
  CANARY_VERSION: "3.0.0"
  GCP_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}

jobs:
  deploy-canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar tag SemVer
        run: |
          test "$GITHUB_REF" = "refs/tags/v4.0.1" || {
            echo "Ejecuta desde el tag v4.0.1." >&2; exit 1;
          }

      - name: Autenticar en Google Cloud mediante Workload Identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verificar stable v2 y preparar su etiqueta
        run: |
          READY=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')
          test -n "$READY" || { echo "No existe revisión estable desplegada." >&2; exit 1; }
          gcloud run services update-traffic "$SERVICE" --project "$PROJECT_ID" --region "$REGION" \
            --to-revisions "$READY=100" --set-tags "stable=$READY"
          echo "STABLE_REVISION=$READY" >> "$GITHUB_ENV"

      - name: Construir y publicar imagen inmutable
        run: |
          TAG="v${CANARY_VERSION}-${GITHUB_SHA::12}"
          docker build --pull --build-arg APP_VERSION="$CANARY_VERSION" -t "$IMAGE:$TAG" .
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker push "$IMAGE:$TAG"
          DIGEST=$(gcloud artifacts docker images describe "$IMAGE:$TAG" --project "$PROJECT_ID" --format='value(image_summary.digest)')
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Digest SHA256 inválido"; exit 1; }
          echo "IMAGE_DIGEST=$IMAGE@$DIGEST" >> "$GITHUB_ENV"

      - name: Desplegar revisión canary aislada con 0% público
        run: |
          gcloud run deploy "$SERVICE" --project "$PROJECT_ID" --region "$REGION" \
            --image "$IMAGE_DIGEST" --no-traffic --tag canary \
            --revision-suffix "v3-${GITHUB_RUN_NUMBER}" \
            --update-env-vars "APP_VERSION=$CANARY_VERSION,APP_TRACK=canary"
          CANARY_REV=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" \
            --format='value(status.latestReadyRevisionName)')
          test -n "$CANARY_REV"
          echo "CANARY_REVISION=$CANARY_REV" >> "$GITHUB_ENV"
          gcloud run services update-traffic "$SERVICE" --project "$PROJECT_ID" --region "$REGION" \
            --to-revisions "$STABLE_REVISION=100" --set-tags "stable=$STABLE_REVISION,canary=$CANARY_REV"

      - name: Smoke test por URL etiquetada canary
        run: |
          URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" \
            --format='value(status.url)')
          TAG_URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" \
            --format=json | jq -r '.status.traffic[] | select(.tag=="canary") | .url')
          test -n "$TAG_URL"
          curl -fsS -D /tmp/headers "$TAG_URL/api/v3/juegos/" -o /tmp/body
          grep -qi '^X-App-Version: 3.0.0' /tmp/headers
          grep -qi '^X-App-Track: canary' /tmp/headers
          echo "Canary verificada; 100% del tráfico público permanece en stable."
