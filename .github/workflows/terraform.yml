name: Terraform - Infraestructura

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Acción de Terraform"
        required: true
        type: choice
        options:
          - validate
          - plan
        default: validate

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Validar infraestructura
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    env:
      TF_VAR_project_id: videojuegos-api-2026-ihoyos
      TF_VAR_database_password: ${{ secrets.TF_VAR_database_password }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validar formato
        run: terraform fmt -check -recursive

      - name: Inicializar Terraform sin backend
        run: terraform init -backend=false

      - name: Validar configuración
        run: terraform validate

      - name: Autenticar con Google Cloud
        if: ${{ inputs.action == 'plan' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Inicializar backend remoto
        if: ${{ inputs.action == 'plan' }}
        run: terraform init -reconfigure

      - name: Generar plan sin aplicar cambios
        if: ${{ inputs.action == 'plan' }}
        run: terraform plan -input=false
