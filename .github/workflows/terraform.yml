name: Terraform - Infraestructura

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Acción de Terraform"
        required: true
        type: choice
        options:
          - validate
          - plan
          - apply
          - destroy
        default: validate
      deploy_cloud_run:
        description: "Crear los servicios de Cloud Run (requiere que la imagen ya exista)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    env:
      TF_VAR_project_id: videojuegos-api-2026-ihoyos
      TF_VAR_database_password: ${{ secrets.TF_VAR_database_password }}
      TF_VAR_deploy_cloud_run: ${{ inputs.deploy_cloud_run }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Validar formato
        run: terraform fmt -check -recursive

      - name: Inicializar sin backend y validar
        run: |
          terraform init -backend=false
          terraform validate

      - name: Autenticar con Google Cloud
        if: ${{ inputs.action != 'validate' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Inicializar backend remoto
        if: ${{ inputs.action != 'validate' }}
        run: terraform init -reconfigure -input=false

      - name: Plan
        if: ${{ inputs.action == 'plan' }}
        run: terraform plan -input=false

      - name: Apply
        if: ${{ inputs.action == 'apply' }}
        run: terraform apply -input=false -auto-approve

      - name: Destroy
        if: ${{ inputs.action == 'destroy' }}
        run: terraform destroy -input=false -auto-approve