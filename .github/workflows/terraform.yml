name: Despliegue - Infraestructura y API


on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  PROJECT_ID: videojuegos-api-2026-ihoyos
  REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/videojuegos-api-2026-ihoyos/videojuegos-api/api
  TF_VAR_project_id: videojuegos-api-2026-ihoyos
  TF_VAR_database_password: ${{ secrets.TF_VAR_database_password }}
  GRAFANA_REMOTE_WRITE_URL: https://prometheus-prod-66-prod-us-east-3.grafana.net/api/prom/push
  GRAFANA_METRICS_USER: "3617508"

jobs:
  deploy:
    name: Terraform + despliegue de la API
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Autenticar con Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v2

      - name: Validar formato, inicializar y validar
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -input=false
          terraform validate

      # Etapa 1: APIs, Artifact Registry, Cloud SQL, Secret Manager e IAM.
      # Cloud Run aún no se crea (deploy_cloud_run=false) porque necesita una imagen publicada.
      - name: Terraform apply - infraestructura base
        working-directory: terraform
        run: terraform apply -input=false -auto-approve -var deploy_cloud_run=false

      - name: Iniciar sesión en Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Construir y publicar la imagen de la API
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      # Etapa 2: servicios Cloud Run (pruebas y producción) con la imagen recién publicada.
      - name: Terraform apply - Cloud Run
        working-directory: terraform
        run: |
          terraform apply -input=false -auto-approve \
            -var deploy_cloud_run=true \
            -var "container_image=$IMAGE:${{ github.sha }}"

      # Terraform ignora cambios de imagen (ignore_changes), así que en re-ejecuciones
      # se fuerza la versión nueva de la API en ambos servicios.
      - name: Instalar la API en Cloud Run
        env:
          GRAFANA_METRICS_TOKEN: ${{ secrets.GRAFANA_METRICS_WRITE_TOKEN }}
        run: |
          for SERVICE in videojuegos-api-testing videojuegos-api-production; do
            ENV_VARS="APP_VERSION=2.0.1,APP_TRACK=stable"
            EXTRA_FLAGS=""
            if [ "$SERVICE" = "videojuegos-api-production" ]; then
              # Solo producción envía métricas a Grafana; el agente necesita CPU siempre asignada.
              ENV_VARS="$ENV_VARS,GRAFANA_REMOTE_WRITE_URL=$GRAFANA_REMOTE_WRITE_URL,GRAFANA_METRICS_USER=$GRAFANA_METRICS_USER,GRAFANA_METRICS_TOKEN=$GRAFANA_METRICS_TOKEN"
              EXTRA_FLAGS="--no-cpu-throttling"
            fi
            gcloud run deploy "$SERVICE" \
              --project "$PROJECT_ID" --region "$REGION" \
              --image "$IMAGE:${{ github.sha }}" \
              --update-env-vars "$ENV_VARS" $EXTRA_FLAGS
            if [ "$SERVICE" = "videojuegos-api-production" ]; then
              REVISION=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')
              gcloud run services update-traffic "$SERVICE" --project "$PROJECT_ID" --region "$REGION" \
                --to-revisions "$REVISION=100" --set-tags "stable=$REVISION"
            fi
          done

      - name: Verificar la API desplegada
        working-directory: terraform
        run: |
          for OUTPUT in testing_api_url production_api_url; do
            URL=$(terraform output -raw "$OUTPUT")
            echo "Probando $OUTPUT: $URL"
            OK=false
            for i in $(seq 1 10); do
              if curl -fsS "$URL/test-db"; then OK=true; echo; break; fi
              echo "Intento $i/10 falló, reintentando en 15 s..."
              sleep 15
            done
            [ "$OK" = true ] || { echo "La API no respondió en $URL"; exit 1; }
          done

      - name: URLs públicas
        working-directory: terraform
        run: terraform output