name: Canary - Rollback manual verificado a 100% stable

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo del rollback (se guarda en el reporte)"
        required: true
        default: "Rollback manual de sustentación"
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: canary
  cancel-in-progress: false

env:
  PROJECT_ID: videojuegos-api-2026-ihoyos
  REGION: us-central1
  SERVICE: videojuegos-api-production
  GCP_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Rollback y verificación Cloud Run real
        env:
          ROLLBACK_REASON: ${{ inputs.reason }}
        run: bash scripts/rollback-canary.sh "$ROLLBACK_REASON"

      - name: Publicar reporte, incluso si falla el rollback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-rollback-report
          path: reports/rollback-*.json
          if-no-files-found: ignore
