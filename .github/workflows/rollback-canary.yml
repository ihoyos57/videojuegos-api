name: Canary - Rollback a stable

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Motivo del rollback
        required: true
        default: Rollback manual
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: videojuegos-canary
  cancel-in-progress: false

env:
  PROJECT_ID: videojuegos-api-2026-ihoyos
  REGION: us-central1
  SERVICE: videojuegos-api-production
  GCP_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Restaurar 100% stable
        env:
          REASON: ${{ inputs.reason }}
        run: bash scripts/rollback-canary.sh "$REASON"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canary-rollback-report
          path: reports/
          if-no-files-found: ignore
