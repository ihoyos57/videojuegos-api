name: CI - Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: videojuegos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d videojuegos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_SCHEMA: schema_testing
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/videojuegos_test

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Ejecutar pruebas y verificar cobertura
        run: |
          python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=60