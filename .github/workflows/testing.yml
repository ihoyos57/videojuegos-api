name: CI/CD - Pruebas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: videojuegos-api-2026-ihoyos
  REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/videojuegos-api-2026-ihoyos/videojuegos-api/api
  SERVICE: videojuegos-api-testing

jobs:
  test:
    name: Pruebas y cobertura (>= 60 %)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: videojuegos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d videojuegos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_SCHEMA: schema_testing
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/videojuegos_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Ejecutar pruebas y exigir cobertura del 60 %
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=60

  deploy:
    
    name: Desplegar en Pruebas
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Construir y publicar imagen
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Comprobar si el servicio de Cloud Run ya existe
        id: servicio
        run: |
          if gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" >/dev/null 2>&1; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "::notice::El servicio $SERVICE aún no existe; solo se publicó la imagen."
          fi

      - name: Desplegar en Cloud Run (pruebas)
        if: steps.servicio.outputs.existe == 'true'
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --image "$IMAGE:${{ github.sha }}"

      - name: Verificar despliegue
        if: steps.servicio.outputs.existe == 'true'
        run: |
          URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')
          echo "URL de pruebas: $URL"
          for i in 1 2 3 4 5; do
            curl -fsS "$URL/test-db" && exit 0
            sleep 10
          done
          exit 1